[package]
name = "libre-cr-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-PR review daemon: agent loop, conversation state, extension transport."

[[bin]]
name = "libre-cr-review"
path = "src/main.rs"

[lib]
name = "libre_cr_review"
path = "src/lib.rs"

[dependencies]
libre-cr-common = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
shellexpand = { workspace = true }
once_cell = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
subtle = "2"

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = "0.23"

# Integration tests locate the code-daemon binary by building it lazily
# via `cargo build --bin libre-cr-code` and pointing at
# `target/<profile>/libre-cr-code`. See `tests/common/mod.rs`. We avoid
# `artifact = "bin"` because it requires nightly's `-Z bindeps`.
