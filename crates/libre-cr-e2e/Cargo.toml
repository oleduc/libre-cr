[package]
name = "libre-cr-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "End-to-end test suites that spawn the real Libre CR binaries and exercise them over the public wire protocols."

# The crate exists only to host integration test binaries. A trivial lib
# target satisfies cargo without exposing anything reusable.
[lib]
path = "src/lib.rs"
test = false
doctest = false

[dev-dependencies]
libre-cr-common = { workspace = true }
# Pulling libre-cr-review as a library dep lets us reuse its `Config`,
# `Store`, and wire-frame types in the spawned-binary HTTP/WS tests.
libre-cr-review = { path = "../libre-cr-review" }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.23"
reqwest = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
once_cell = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
