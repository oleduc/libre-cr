[workspace]
resolver = "2"
members = [
    "crates/libre-cr-common",
    "crates/libre-cr-code",
    "crates/libre-cr-review",
    "crates/libre-cr-cli",
    "crates/libre-cr-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/libre-cr/libre-cr"
homepage = "https://libre-cr.dev"
authors = ["Libre CR contributors"]

[workspace.dependencies]
libre-cr-common = { path = "crates/libre-cr-common" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }

# Review daemon
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
hex = "0.4"
http = "1"

# Code daemon
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
walkdir = "2"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
gix = { version = "0.66", default-features = false, features = ["max-performance-safe", "blocking-network-client", "revision", "revparse-regex"] }
tempfile = "3"
dirs = "5"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
shellexpand = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
